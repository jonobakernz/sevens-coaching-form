name: Deploy to static.app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A new cache name on every release makes phones fetch the new files.
      - name: Set the offline cache name
        run: sed -i "s/^const CACHE = '.*';/const CACHE = 'sevens-form-${GITHUB_SHA::7}';/" sw.js

      - name: Build the site zip
        run: zip -rq site.zip index.html manifest.webmanifest sw.js icons fonts lib demo/demo.json

      - name: Upload to static.app
        env:
          STATICAPP_API_KEY: ${{ secrets.STATICAPP_API_KEY }}
          STATICAPP_PID: ${{ vars.STATICAPP_PID }}
        run: |
          test -n "$STATICAPP_API_KEY" || { echo "Add the STATICAPP_API_KEY secret"; exit 1; }
          test -n "$STATICAPP_PID" || { echo "Add the STATICAPP_PID variable"; exit 1; }
          curl --fail-with-body -sS -X POST https://api.static.app/v1/sites/zip \
            -H "Authorization: Bearer $STATICAPP_API_KEY" -H "Accept: application/json" \
            -F "archive=@site.zip" -F "pid=$STATICAPP_PID"
          echo
          curl --fail-with-body -sS -X POST "https://api.static.app/v1/sites/$STATICAPP_PID/purge-cache" \
            -H "Authorization: Bearer $STATICAPP_API_KEY" -H "Accept: application/json"
